<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ConectaSangue ABC - Doação de Sangue</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header id="main-header"></header>

    <main id="app">
        <section id="hero">
            <h1>Encontre o Hemocentro mais próximo</h1>
            <p>Sua doação pode salvar vidas em Diadema e região do ABC.</p>
            <div class="search-container">
                <input type="text" id="search-input" placeholder="Digite seu bairro ou CEP em Diadema...">
                <button id="search-btn">Buscar</button>
            </div>
        </section>

        <section id="map-section">
            <h2>Mapa Interativo</h2>
            <div id="map" style="height: 400px; border-radius: 8px; margin-top: 1rem; box-shadow: 0 2px 8px rgba(0,0,0,0.1);"></div>
        </section>

        <section id="results">
            <h2>Hemocentros na Região</h2>
            <div id="hemocentros-list" class="cards-container">
                <!-- Cards serão injetados via JS -->
            </div>
        </section>
    </main>

    <footer id="main-footer"></footer>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="js/shared.js"></script>
    <script src="js/home.js"></script>
</body>
</html>
